<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoBank — Cổng Yêu Cầu Quyền Chủ Thể Dữ Liệu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary:       #0057FF;
      --bg:            #F0F4FF;
      --surface:       #FFFFFF;
      --border:        #E4EBFF;
      --text-primary:  #0A1628;
      --text-secondary:#4B6080;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background-color: var(--bg);
      color: var(--text-primary); min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .app-header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 15px 40px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-icon {
      width: 34px; height: 34px; background: linear-gradient(135deg, var(--primary), #00B8FF);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-size: 18px; font-weight: 800; color: var(--text-primary); }
    .btn-back-home { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 600; }
    .btn-back-home:hover { color: var(--primary); }

    .layout-container {
      flex: 1; display: flex; max-width: 1440px; width: 100%;
      margin: 0 auto; padding: 30px 40px; gap: 30px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 320px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px; height: fit-content;
    }
    .sidebar-title {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-secondary); font-weight: 700; margin-bottom: 10px; padding-left: 12px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border-radius: 12px; cursor: pointer; color: var(--text-secondary);
      font-weight: 600; font-size: 14px; transition: all 0.2s ease;
      border: none; background: none; width: 100%; text-align: left;
    }
    .menu-item:hover { background: var(--bg); color: var(--primary); }
    .menu-item.active { background: var(--primary); color: var(--surface); }
    .menu-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* CONTENT AREA */
    .content-area {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 35px; display: flex; flex-direction: column;
    }
    .content-header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .content-title { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; }
    .content-desc { font-size: 14px; color: var(--text-secondary); }

    /* IFRAME BOX */
    .iframe-container {
      position: relative; flex: 1; min-height: 550px;
      border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: #FAFBFF;
    }
    .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    @media (max-width: 992px) {
      .layout-container { flex-direction: column; padding: 20px; }
      .sidebar { width: 100%; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 2L18 7V13L10 18L2 13V7L10 2Z" fill="white"/></svg>
      </div>
      <span class="logo-text">NeoBank</span>
    </a>
    <a href="index.html" class="btn-back-home">Quay lại Trang chủ →</a>
  </header>

  <div class="layout-container">
    <aside class="sidebar">
      <div class="sidebar-title">Quyền chủ thể dữ liệu</div>
      
      <button class="menu-item active" onclick="switchTab(this, 'rut-lai', 'Quyền rút lại sự đồng ý', 'Yêu cầu hủy hoặc thu hồi sự đồng ý xử lý thông tin cá nhân trước đây của bạn.')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Rút lại sự đồng ý
      </button>

      <button class="menu-item" onclick="switchTab(this, 'truy-cap', 'Quyền truy cập dữ liệu', 'Tra cứu, kiểm tra các danh mục thông tin định danh cá nhân đang lưu giữ trên máy chủ.')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        Các yêu cầu khác
      </button>
    </aside>

    <main class="content-area">
      <div class="content-header">
        <h1 class="content-title" id="pageTitle">Quyền rút lại sự đồng ý</h1>
        <p class="content-desc" id="pageDesc">Yêu cầu hủy hoặc thu hồi sự đồng ý xử lý thông tin cá nhân trước đây của bạn.</p>
      </div>
      <div class="iframe-container">
        <iframe id="policyIframe" src="https://example.com/iframe-rut-lai" title="Form xử lý quyền"></iframe>
      </div>
    </main>
  </div>

  <script>
    function switchTab(element, type, title, description) {
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      document.getElementById('pageTitle').textContent = title;
      document.getElementById('pageDesc').textContent = description;

      // ĐIỀU CHỈNH ĐƯỜNG DẪN IFRAME TẠI ĐÂY
      const iframe = document.getElementById('policyIframe');
      if (type === 'rut-lai') {
        iframe.src = "https://irm-api.datatrust.one/irm/request/839275/1e92/00f0c8f3-1e92-4687-84d9-9083a92a14cc";
      } else if (type === 'truy-cap') {
        iframe.src = "https://irm-api.datatrust.one/irm/request/839275/1e92/00f0c8f3-1e92-4687-84d9-9083a92a14cc";
      }
    }
  </script>
</body>
</html>
